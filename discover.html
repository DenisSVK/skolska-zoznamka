<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Objavuj | Školská Zoznamka</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff5f8;
            color: #3d2630;
            min-height: 100vh;
        }

        nav {
            height: 70px;
            background: white;
            border-bottom: 1px solid #f3dce5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            color: #e75480;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #694653;
            font-size: 14px;
        }

        .page {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #80616d;
        }

        .profile-card {
            max-width: 430px;
            margin: auto;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(80, 30, 50, 0.12);
        }

        .photo {
            height: 300px;
            background: linear-gradient(135deg, #ffd6e7, #ffeef5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
        }

        .info {
            padding: 25px;
        }

        .name {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .class {
            color: #e75480;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .bio {
            color: #694653;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .interests {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .interest {
            background: #fff0f6;
            color: #c43e68;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .actions {
            display: flex;
            gap: 15px;
            padding: 0 25px 25px;
        }

        .action {
            flex: 1;
            height: 55px;
            border-radius: 30px;
            border: none;
            font-size: 22px;
            cursor: pointer;
        }

        .skip {
            background: #f5f0f2;
        }

        .like {
            background: #e75480;
            color: white;
        }

        .hint {
            text-align: center;
            color: #9a7b86;
            font-size: 13px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            nav {
                padding: 0 20px;
            }

            .nav-links {
                display: none;
            }

            .page {
                margin-top: 25px;
            }

            .photo {
                height: 260px;
            }
        }
    </style>
</head>

<body>

<nav>

    <div class="logo">
        💗 Školská Zoznamka
    </div>

    <div class="nav-links">
        <a href="profile.html">Môj profil</a>
        <a href="matches.html">Matchy</a>
        <a href="chat.html">Chat</a>
    </div>

</nav>

<div class="page">

    <div class="heading">
        <h1>Objavuj 👀</h1>
        <p>Spoznaj ľudí z tvojej školy.</p>
    </div>

    <div class="profile-card">

        <div class="photo">
            😊
        </div>

        <div class="info">

            <div class="name">
                Sofia
            </div>

            <div class="class">
                2.B
            </div>

            <div class="bio">
                Milujem hudbu, filmy a trávenie času s kamarátmi.
                Vždy som za dobrý výlet alebo koncert. 🎵
            </div>

            <div class="interests">
                <span class="interest">🎵 Hudba</span>
                <span class="interest">🎬 Filmy</span>
                <span class="interest">🏐 Volejbal</span>
                <span class="interest">✈️ Cestovanie</span>
            </div>

        </div>

        <div class="actions">

            <button class="action skip">
                ✕
            </button>

            <button class="action like">
                ❤️
            </button>

        </div>

    </div>

    <div class="hint">
        ❤️ Páči sa mi &nbsp; • &nbsp; ✕ Preskočiť
    </div>

</div>

</body>
</html>
