<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matchy | Školská Zoznamka</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff5f8;
            color: #3d2630;
            min-height: 100vh;
        }

        nav {
            height: 70px;
            background: white;
            border-bottom: 1px solid #f3dce5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
        }

        .logo {
            color: #e75480;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #694653;
            font-size: 14px;
        }

        .page {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #80616d;
        }

        .matches {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .match {
            background: white;
            border-radius: 22px;
            padding: 22px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(80, 30, 50, 0.08);
        }

        .avatar {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            background: #ffd6e7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            margin: 0 auto 15px;
        }

        .name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .class {
            color: #e75480;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .chat {
            display: block;
            text-decoration: none;
            background: #e75480;
            color: white;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            background: white;
            padding: 45px 25px;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(80, 30, 50, 0.08);
        }

        .empty-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .empty h2 {
            margin-bottom: 10px;
        }

        .empty p {
            color: #80616d;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            nav {
                padding: 0 20px;
            }

            .nav-links {
                display: none;
            }

            .page {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

<nav>

    <div class="logo">
        💗 Školská Zoznamka
    </div>

    <div class="nav-links">
        <a href="discover.html">Objavovať</a>
        <a href="profile.html">Môj profil</a>
        <a href="chat.html">Chat</a>
    </div>

</nav>

<div class="page">

    <div class="heading">
        <h1>Vaše matchy 💕</h1>
        <p>Ľudia, s ktorými máte vzájomný záujem.</p>
    </div>

    <div class="matches">

        <div class="match">

            <div class="avatar">
                😊
            </div>

            <div class="name">
                Sofia
            </div>

            <div class="class">
                2.B
            </div>

            <a href="chat.html" class="chat">
                💬 Napísať
            </a>

        </div>

        <div class="match">

            <div class="avatar">
                😎
            </div>

            <div class="name">
                Alex
            </div>

            <div class="class">
                3.A
            </div>

            <a href="chat.html" class="chat">
                💬 Napísať
            </a>

        </div>

    </div>

</div>

</body>
</html>
