<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matchy | Školská Zoznamka</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff5f8;
            color: #3d2630;
            min-height: 100vh;
        }

        nav {
            height: 70px;
            background: white;
            border-bottom: 1px solid #f3dce5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: #e75480;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #694653;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: #e75480;
        }

        .menu-button {
            display: none;
            border: none;
            background: #fff0f6;
            color: #e75480;
            font-size: 24px;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
        }

        .page {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #80616d;
        }

        .matches {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .match {
            background: white;
            border-radius: 22px;
            padding: 22px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(80, 30, 50, 0.08);
        }

        .avatar {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            background: #ffd6e7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            margin: 0 auto 15px;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .class {
            color: #e75480;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .chat {
            display: block;
            text-decoration: none;
            background: #e75480;
            color: white;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
        }

        .chat:hover {
            background: #d94370;
        }

        .empty {
            text-align: center;
            background: white;
            padding: 45px 25px;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(80, 30, 50, 0.08);
        }

        .empty-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .empty h2 {
            margin-bottom: 10px;
        }

        .empty p {
            color: #80616d;
            line-height: 1.5;
        }

        .status {
            text-align: center;
            background: white;
            padding: 35px 25px;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(80, 30, 50, 0.08);
            color: #80616d;
        }

        .error {
            color: #c43e68;
        }

        @media (max-width: 600px) {

            nav {
                padding: 0 20px;
            }

            .menu-button {
                display: block;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: 70px;
                right: 15px;
                left: 15px;
                background: white;
                flex-direction: column;
                align-items: stretch;
                gap: 0;
                padding: 10px;
                border-radius: 16px;
                box-shadow: 0 10px 30px rgba(80, 30, 50, 0.15);
            }

            .nav-links.active {
                display: flex;
            }

            .nav-links a {
                padding: 15px;
                border-radius: 10px;
                font-size: 15px;
            }

            .nav-links a:hover {
                background: #fff0f6;
            }

            .page {
                margin-top: 25px;
            }

            .heading h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<nav>

    <div class="logo">
        💗 Školská Zoznamka
    </div>

    <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="Otvoriť menu"
    >
        ☰
    </button>

    <div class="nav-links" id="navLinks">

        <a href="discover.html">
            🔎 Objavovať
        </a>

        <a href="matches.html">
            💗 Matchy
        </a>

        <a href="chat.html">
            💬 Chat
        </a>

        <a href="profile.html">
            👤 Profil
        </a>

        <a href="settings.html">
            ⚙️ Nastavenia
        </a>

    </div>

</nav>

<div class="page">

    <div class="heading">

        <h1>
            Tvoje matchy 💕
        </h1>

        <p>
            Ľudia, s ktorými máte vzájomný záujem.
        </p>

    </div>

    <div
        class="matches"
        id="matches"
    >

        <div class="status">
            ⏳ Načítavam matchy...
        </div>

    </div>

</div>

<script>

const menuButton =
    document.getElementById("menuButton");

const navLinks =
    document.getElementById("navLinks");

const matchesContainer =
    document.getElementById("matches");


menuButton.addEventListener("click", function() {

    navLinks.classList.toggle("active");

});


function escapeHtml(value) {

    if (!value) {
        return "";
    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


function renderMatches(matches) {

    if (!matches || matches.length === 0) {

        matchesContainer.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    💗
                </div>

                <h2>
                    Zatiaľ nemáš žiadne matchy
                </h2>

                <p>
                    Keď si s niekým navzájom dáte páči sa mi,
                    zobrazí sa tu váš match.
                </p>

            </div>

        `;

        return;
    }


    matchesContainer.innerHTML = "";


    matches.forEach(profile => {

        const card =
            document.createElement("div");

        card.className = "match";


        let avatar = "😊";


        if (profile.profile_image) {

            avatar = `

                <img
                    src="${escapeHtml(profile.profile_image)}"
                    alt="Profilová fotka"
                >

            `;

        }


        card.innerHTML = `

            <div class="avatar">
                ${avatar}
            </div>

            <div class="name">
                ${escapeHtml(profile.username)}
            </div>

            <div class="class">
                ${escapeHtml(profile.class_name || "")}
            </div>

            <a
                href="chat.html"
                class="chat"
            >
                💬 Napísať
            </a>

        `;


        matchesContainer.appendChild(card);

    });

}


async function loadMatches() {

    matchesContainer.innerHTML = `

        <div class="status">
            ⏳ Načítavam matchy...
        </div>

    `;


    try {

        const response =
            await fetch("/api/matches");


        const data =
            await response.json();


        if (!response.ok) {

            matchesContainer.innerHTML = `

                <div class="status error">

                    ❌

                    ${escapeHtml(
                        data.error ||
                        "Matchy sa nepodarilo načítať."
                    )}

                </div>

            `;

            return;
        }


        renderMatches(data.matches);


    } catch (error) {

        console.error(error);


        matchesContainer.innerHTML = `

            <div class="status error">

                ❌ Nepodarilo sa spojiť so serverom.

            </div>

        `;

    }

}


loadMatches();

</script>

</body>
</html>
