<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Môj profil | Školská Zoznamka</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #fff5f8;
            color: #3d2630;
        }

        nav {
            min-height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 7%;
            border-bottom: 1px solid #f3dce5;
            position: relative;
        }

        .logo {
            color: #e75480;
            font-size: 22px;
            font-weight: bold;
        }

        /* DESKTOP MENU */

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #694653;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: #e75480;
        }

        /* MOBILE MENU BUTTON */

        .menu-button {
            display: none;
            border: none;
            background: #fff0f6;
            color: #e75480;
            font-size: 24px;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
        }

        .page {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .title {
            margin-bottom: 25px;
        }

        .title h1 {
            font-size: 34px;
        }

        .title p {
            color: #80616d;
            margin-top: 7px;
        }

        .card {
            background: white;
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(80, 30, 50, 0.08);
        }

        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #ffd6e7;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .avatar span {
            font-size: 55px;
        }

        .upload-label {
            background: #fff0f6;
            color: #c43e68;
            padding: 10px 17px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        #profileImage {
            display: none;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 7px;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid #ead5de;
            border-radius: 12px;
            padding: 13px;
            font-size: 15px;
            margin-bottom: 18px;
            font-family: inherit;
            outline: none;
            background: white;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #e75480;
        }

        .hint {
            color: #8b6875;
            font-size: 12px;
            margin-top: -10px;
            margin-bottom: 18px;
        }

        .save {
            border: none;
            background: #e75480;
            color: white;
            padding: 14px 25px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .save:hover {
            opacity: 0.9;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        /* MOBIL */

        @media (max-width: 600px) {

            nav {
                padding: 15px 20px;
            }

            .logo {
                font-size: 18px;
            }

            .menu-button {
                display: block;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: 70px;
                right: 15px;
                left: 15px;
                background: white;
                flex-direction: column;
                align-items: stretch;
                gap: 0;
                padding: 10px;
                border-radius: 16px;
                box-shadow: 0 10px 30px rgba(80, 30, 50, 0.15);
                z-index: 1000;
            }

            .nav-links.active {
                display: flex;
            }

            .nav-links a {
                padding: 15px;
                border-radius: 10px;
                font-size: 15px;
            }

            .nav-links a:hover {
                background: #fff0f6;
            }

            .page {
                margin-top: 25px;
                padding: 0 15px;
            }

            .title h1 {
                font-size: 28px;
            }

            .card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<nav>

    <div class="logo">
        💗 Školská Zoznamka
    </div>

    <!-- Tlačidlo pre mobil -->

    <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="Otvoriť menu"
    >
        ☰
    </button>

    <!-- Navigácia -->

    <div class="nav-links" id="navLinks">

        <a href="discover.html">
            🔎 Objavovať
        </a>

        <a href="matches.html">
            💗 Matchy
        </a>

        <a href="chat.html">
            💬 Chat
        </a>

        <a href="profile.html">
            👤 Profil
        </a>

        <a href="settings.html">
            ⚙️ Nastavenia
        </a>

    </div>

</nav>


<div class="page">

    <div class="title">

        <h1>
            Môj profil 👤
        </h1>

        <p>
            Takto ťa môžu vidieť ostatní používatelia.
        </p>

    </div>


    <div class="card">

        <form id="profileForm">

            <div class="avatar-section">

                <div class="avatar">

                    <span id="avatarEmoji">
                        😊
                    </span>

                    <img
                        id="avatarImage"
                        alt="Profilová fotka"
                    >

                </div>

                <label
                    for="profileImage"
                    class="upload-label"
                >
                    📷 Vybrať profilovú fotku
                </label>

                <input
                    id="profileImage"
                    type="file"
                    accept="image/*"
                >

            </div>


            <label for="username">
                Prezývka
            </label>

            <input
                id="username"
                type="text"
                maxlength="50"
                placeholder="Ako ťa máme zobrazovať?"
                required
            >


            <label for="class">
                Trieda
            </label>

            <select
                id="class"
                required
            >

                <option value="">
                    Vyber svoju triedu
                </option>

                <optgroup label="1. ročník">

                    <option value="1.A">1.A</option>
                    <option value="1.B">1.B</option>
                    <option value="1.C">1.C</option>
                    <option value="1.D">1.D</option>
                    <option value="1.E">1.E</option>
                    <option value="1.J">1.J</option>
                    <option value="1.S">1.S</option>

                </optgroup>


                <optgroup label="2. ročník">

                    <option value="2.A">2.A</option>
                    <option value="2.B">2.B</option>
                    <option value="2.C">2.C</option>
                    <option value="2.D">2.D</option>
                    <option value="2.E">2.E</option>
                    <option value="2.J">2.J</option>
                    <option value="2.S">2.S</option>

                </optgroup>


                <optgroup label="3. ročník">

                    <option value="3.A">3.A</option>
                    <option value="3.B">3.B</option>
                    <option value="3.C">3.C</option>
                    <option value="3.D">3.D</option>
                    <option value="3.J">3.J</option>

                </optgroup>


                <optgroup label="4. ročník">

                    <option value="4.A">4.A</option>
                    <option value="4.B">4.B</option>
                    <option value="4.C">4.C</option>
                    <option value="4.D">4.D</option>

                </optgroup>


                <optgroup label="5. ročník">

                    <option value="5.A">5.A</option>

                </optgroup>

            </select>


            <label for="bio">
                O mne
            </label>

            <textarea
                id="bio"
                maxlength="500"
                placeholder="Napíš niečo o sebe..."
            ></textarea>


            <label for="interests">
                Moje záujmy
            </label>

            <input
                id="interests"
                type="text"
                maxlength="300"
                placeholder="Napr. futbal, hudba, hry, filmy..."
            >

            <div class="hint">
                Napíš svoje záujmy, napríklad:
                futbal, hudba, Minecraft, filmy.
            </div>


            <label for="instagram">
                Instagram
                <span style="font-weight: normal;">
                    (voliteľné)
                </span>
            </label>

            <input
                id="instagram"
                type="text"
                maxlength="100"
                placeholder="@tvojinstagram"
            >

            <div class="hint">
                Instagram nemusíš vyplniť.
            </div>


            <button
                class="save"
                type="submit"
            >
                Uložiť profil 💗
            </button>

            <div
                id="message"
                class="message"
            ></div>

        </form>

    </div>

</div>


<script>

/* ================================
   MOBILNÉ MENU
================================ */

const menuButton =
    document.getElementById("menuButton");

const navLinks =
    document.getElementById("navLinks");


menuButton.addEventListener("click", function() {

    navLinks.classList.toggle("active");

});


/* ================================
   PROFILOVÁ FOTKA
================================ */

const profileImageInput =
    document.getElementById("profileImage");

const avatarImage =
    document.getElementById("avatarImage");

const avatarEmoji =
    document.getElementById("avatarEmoji");

let profileImageData = "";


profileImageInput.addEventListener(
    "change",
    function() {

        const file = this.files[0];

        if (!file) {
            return;
        }


        if (!file.type.startsWith("image/")) {

            alert("Vyber prosím obrázok.");

            this.value = "";

            return;
        }


        if (file.size > 2 * 1024 * 1024) {

            alert(
                "Profilová fotka môže mať maximálne 2 MB."
            );

            this.value = "";

            return;
        }


        const reader =
            new FileReader();


        reader.onload = function(event) {

            profileImageData =
                event.target.result;

            avatarImage.src =
                profileImageData;

            avatarImage.style.display =
                "block";

            avatarEmoji.style.display =
                "none";

        };


        reader.readAsDataURL(file);

    }
);


/* ================================
   NAČÍTANIE PROFILU
================================ */

async function loadProfile() {

    try {

        const response =
            await fetch("/api/profile");


        if (!response.ok) {
            return;
        }


        const data =
            await response.json();


        if (!data.profile) {
            return;
        }


        const profile =
            data.profile;


        document.getElementById("username").value =
            profile.username || "";


        document.getElementById("class").value =
            profile.class_name || "";


        document.getElementById("bio").value =
            profile.bio || "";


        document.getElementById("interests").value =
            profile.interests || "";


        document.getElementById("instagram").value =
            profile.instagram || "";


        if (profile.profile_image) {

            profileImageData =
                profile.profile_image;

            avatarImage.src =
                profile.profile_image;

            avatarImage.style.display =
                "block";

            avatarEmoji.style.display =
                "none";

        }

    } catch (error) {

        console.error(error);

    }

}


/* ================================
   ULOŽENIE PROFILU
================================ */

document
    .getElementById("profileForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const message =
                document.getElementById("message");


            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();


            const className =
                document
                    .getElementById("class")
                    .value;


            const bio =
                document
                    .getElementById("bio")
                    .value
                    .trim();


            const interests =
                document
                    .getElementById("interests")
                    .value
                    .trim();


            const instagram =
                document
                    .getElementById("instagram")
                    .value
                    .trim();


            if (!username || !className) {

                message.textContent =
                    "Vyplň prezývku a vyber triedu.";

                return;
            }


            message.textContent =
                "Ukladám profil...";


            try {

                const response =
                    await fetch(
                        "/api/profile",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                username:
                                    username,

                                className:
                                    className,

                                bio:
                                    bio,

                                interests:
                                    interests,

                                instagram:
                                    instagram,

                                profileImage:
                                    profileImageData

                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    message.textContent =
                        data.error ||
                        "Profil sa nepodarilo uložiť.";

                    return;
                }


                message.textContent =
                    "Profil bol úspešne uložený! 💗";


            } catch (error) {

                console.error(error);


                message.textContent =
                    "Nastala chyba pri komunikácii so serverom.";

            }

        }
    );


/* ================================
   SPUSTENIE
================================ */

loadProfile();

</script>

</body>
</html>
