<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff5f8;
            color: #333;
        }

        header {
            background: #ff8fb1;
            padding: 18px 25px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        .back {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .chat-container {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .messages {
            min-height: 450px;
            max-height: 550px;
            overflow-y: auto;
            padding: 25px;
        }

        .empty {
            text-align: center;
            color: #999;
            padding: 100px 20px;
        }

        .message {
            margin-bottom: 14px;
            display: flex;
        }

        .message.mine {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 70%;
            padding: 11px 15px;
            border-radius: 18px;
            background: #f1f1f1;
            word-wrap: break-word;
        }

        .mine .bubble {
            background: #ff8fb1;
            color: white;
        }

        .time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
        }

        .input-area {
            border-top: 1px solid #eee;
            padding: 15px;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 13px 16px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 15px;
        }

        .input-area button {
            border: none;
            background: #ff8fb1;
            color: white;
            padding: 0 22px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        .input-area button:hover {
            background: #ff729d;
        }

        @media (max-width: 600px) {
            .chat-container {
                margin: 10px;
            }

            .messages {
                min-height: 400px;
            }

            .bubble {
                max-width: 85%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1 id="chatTitle">Chat</h1>
    <a href="chat.html" class="back">← Späť</a>
</header>

<div class="chat-container">

    <div class="messages" id="messages">
        <div class="empty">
            Načítavam chat...
        </div>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="messageInput"
            placeholder="Napíš správu..."
            autocomplete="off"
        >

        <button onclick="sendMessage()">
            Odoslať
        </button>
    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const conversationId = params.get("id");

if (!conversationId) {
    document.getElementById("messages").innerHTML =
        '<div class="empty">Chat nebol nájdený.</div>';
}

async function loadMessages() {

    if (!conversationId) return;

    try {

        const response = await fetch(
            `/api/messages?conversation=${conversationId}`
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Chyba");
        }

        const messages = data.messages || [];

        const container = document.getElementById("messages");

        if (messages.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    Zatiaľ tu nie sú žiadne správy.<br>
                    Napíš prvú správu 💗
                </div>
            `;

            return;
        }

        container.innerHTML = messages.map(message => `
            <div class="message ${message.is_mine ? "mine" : ""}">
                <div class="bubble">
                    ${escapeHtml(message.message)}

                    <div class="time">
                        ${formatTime(message.created_at)}
                    </div>
                </div>
            </div>
        `).join("");

        container.scrollTop = container.scrollHeight;

    } catch (error) {

        console.error(error);

        document.getElementById("messages").innerHTML = `
            <div class="empty">
                Nepodarilo sa načítať správy.
            </div>
        `;
    }
}

async function sendMessage() {

    const input = document.getElementById("messageInput");
    const message = input.value.trim();

    if (!message || !conversationId) return;

    input.disabled = true;

    try {

        const response = await fetch("/api/messages", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                conversationId,
                message
            })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.error || "Správu sa nepodarilo odoslať.");
            return;
        }

        input.value = "";

        await loadMessages();

    } catch (error) {

        console.error(error);

        alert("Správu sa nepodarilo odoslať.");

    } finally {

        input.disabled = false;
        input.focus();

    }
}

function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

function formatTime(date) {

    const d = new Date(date);

    return d.toLocaleTimeString("sk-SK", {
        hour: "2-digit",
        minute: "2-digit"
    });
}

document
    .getElementById("messageInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    });

loadMessages();

setInterval(loadMessages, 5000);

</script>

</body>
</html>
